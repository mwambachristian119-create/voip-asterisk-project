[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[endpoint-tpl](!)
type=endpoint
context=internes
disallow=all
allow=ulaw,alaw,opus,h264,vp8
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
message_context=messages

[auth-tpl](!)
type=auth
auth_type=userpass

[aor-tpl](!)
type=aor
max_contacts=1
remove_existing=yes

[1001](endpoint-tpl)
auth=1001
aors=1001
callerid="Christian" <1001>
[1001](auth-tpl)
username=1001
password=CHANGE_ME
[1001](aor-tpl)

[1002](endpoint-tpl)
auth=1002
aors=1002
callerid="Ami 1" <1002>
[1002](auth-tpl)
username=1002
password=CHANGE_ME
[1002](aor-tpl)

[1003](endpoint-tpl)
auth=1003
aors=1003
callerid="Ami 2" <1003>
